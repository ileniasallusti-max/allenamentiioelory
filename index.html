<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Allenamenti</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Allenamenti">
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0B;--card:#151517;--card2:#1E1E21;--line:#2A2A2E;--ink:#F5F5F4;--mute:#8E8E93;--acc:#C6FF3D;--acc-ink:#0A0A0B;--red:#FF5A4E;--red-soft:rgba(255,90,78,.13)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 48px)}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
.hide{display:none!important}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.block{margin-top:28px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.link{font-size:14px;font-weight:700;color:var(--acc)}
.card{background:var(--card);border-radius:24px;padding:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--ink);color:var(--bg);font-weight:800;font-size:16px;padding:17px;border-radius:18px}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.dark{background:var(--card2);color:var(--ink)}
.btn:disabled{opacity:.4}
input[type=text],input[type=password]{width:100%;font-family:inherit;font-size:17px;padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
input:focus{border-color:var(--acc)}
.field{margin-bottom:16px}.field .lbl{display:block;margin-bottom:8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button,.days span{aspect-ratio:1;border-radius:14px;background:var(--card2);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.days .on{background:var(--acc);color:var(--acc-ink)}
.days .now{outline:2px solid var(--ink);outline-offset:2px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who button{padding:20px;border-radius:18px;background:var(--card);font-weight:800;font-size:17px}
.err{color:var(--red);font-size:14px;margin-top:10px;font-weight:700}
.small{font-size:14px;color:var(--mute)}
/* top */
.top{display:flex;justify-content:space-between;align-items:flex-end}
.gear{width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center}
/* streak */
.streaks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sk{background:var(--card);border-radius:24px;padding:16px 16px 14px;position:relative;overflow:hidden}
.sk.me{background:linear-gradient(160deg,#1C1F12,#151517 60%)}
.sk .n{display:flex;align-items:baseline;gap:6px;margin:8px 0 2px}
.sk .n b{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.sk .n span{font-size:24px}
.sk .st{display:inline-block;margin-top:12px;font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;background:var(--card2);color:var(--mute)}
.sk .st.done{background:var(--acc);color:var(--acc-ink)}.sk .st.todo{background:var(--red-soft);color:var(--red)}
/* upload hero */
.hero{background:var(--card);border-radius:26px;padding:22px 20px 20px;border:1px solid var(--line)}
.hero h3{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:8px 0 16px;line-height:1.15}
.steps{list-style:none;display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.steps li{display:flex;gap:12px;align-items:center;font-size:15px;font-weight:600}
.steps li b{width:30px;height:30px;flex:none;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--acc)}
.hero .btn{font-size:17px;padding:19px}
.hero .small{margin-top:12px;text-align:center}
/* photos */
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pic{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:var(--card);display:flex;align-items:center;justify-content:center;text-align:center}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic img.blur{filter:blur(24px) brightness(.7);transform:scale(1.2)}
.pic .tag{position:absolute;left:10px;top:10px;background:rgba(10,10,11,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;z-index:2}
.pic .time{position:absolute;right:10px;bottom:10px;background:rgba(10,10,11,.7);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;z-index:2}
.pic .ph{padding:16px;color:var(--mute);font-size:14px;font-weight:700;z-index:2;position:relative}
.pic .lock{position:relative;z-index:2;color:#fff;font-weight:800;font-size:14px;padding:16px;line-height:1.35}
.pic .lock em{display:block;font-style:normal;font-size:26px;margin-bottom:6px}
.pic.empty{border:1.5px dashed var(--line);background:transparent}
.change{position:absolute;right:10px;top:10px;z-index:2;background:rgba(10,10,11,.7);color:#fff;font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px}
/* penalty */
.pen{background:var(--red-soft);border:1px solid rgba(255,90,78,.35);border-radius:24px;padding:18px;margin-bottom:10px}
.pen .lbl{color:var(--red)}
.pen p{font-size:19px;font-weight:800;margin:8px 0 6px;letter-spacing:-.01em}
.pen button{margin-top:14px;background:var(--ink);color:var(--bg);font-weight:800;font-size:14px;padding:11px 16px;border-radius:12px}
/* tracker */
.track{margin-bottom:20px}.track:last-of-type{margin-bottom:0}
.track .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.track .head b{font-weight:800}
.track .head span{font-size:13px;color:var(--mute);font-weight:700}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.g .wd{font-size:11px;color:var(--mute);text-align:center;font-weight:800}
.g i{aspect-ratio:1;border-radius:8px;display:block;background:var(--card2)}
.g i.done{background:var(--acc)}
.g i.miss{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,90,78,.55);position:relative}
.g i.miss::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--red)}
.g i.todo{background:transparent;box-shadow:inset 0 0 0 2px var(--acc)}
.g i.rest{background:#18181A}
.g i.rec{background:rgba(198,255,61,.32)}
.warn{background:rgba(255,184,0,.10);border:1px solid rgba(255,184,0,.4);border-radius:24px;padding:18px;margin-bottom:10px}
.warn .lbl{color:#FFB800}
.warn p{font-size:17px;font-weight:800;margin:8px 0 6px;letter-spacing:-.01em}
.g i.future{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.g i.none{background:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--mute);font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* archive */
details.arch{background:var(--card);border-radius:24px;overflow:hidden}
details.arch summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;cursor:pointer}
details.arch summary::-webkit-details-marker{display:none}
details.arch summary .ch{transition:transform .25s;color:var(--mute);font-size:18px}
details.arch[open] summary .ch{transform:rotate(180deg)}
details.arch .body{padding:0 16px 16px}
.day{margin-bottom:18px}
.day .d{font-size:13px;font-weight:800;color:var(--mute);margin-bottom:8px;text-transform:capitalize}
.day .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day .two .pic{border-radius:16px;background:var(--card2)}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 24px);max-height:90vh;overflow:auto}
.sheet .xbar{position:sticky;top:0;height:0;display:flex;justify-content:flex-end;z-index:3}
.sheet .x{width:38px;height:38px;border-radius:50%;background:var(--card2);color:var(--ink);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:translateY(-6px)}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 18px}
.sheet .sec{margin-bottom:28px}
.list{list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.list li span{flex:1}
.list li button{width:30px;height:30px;border-radius:50%;background:var(--card2);color:var(--mute);font-size:16px;flex:none}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1}
.add button{background:var(--card2);border-radius:14px;padding:0 16px;font-weight:800}
.light-box{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.light-box img{max-width:100%;max-height:100%;border-radius:18px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;font-size:14px;padding:12px 18px;border-radius:999px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.notice{background:var(--card);border-radius:20px;padding:14px 16px;font-size:14px;display:flex;gap:12px;align-items:center;margin-top:16px}
.notice b{font-weight:800}
.notice button{margin-left:auto;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:13px;padding:10px 14px;border-radius:12px;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading"><div class="spin"></div></div></div>
<input type="file" id="file" accept="image/*" class="hide">
<div class="toast" id="toast"></div>

<script>
const WD=["L","M","M","G","V","S","D"];
const WDL=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
const KEY="allenamenti_auth";
let S=null, auth=null, busy=false, PL=null;
try{auth=JSON.parse(localStorage.getItem(KEY)||"null")}catch{}
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(d,o)=>new Date(d+"T12:00:00").toLocaleDateString("it-IT",o);
const hhmm=iso=>new Date(iso).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
const wdOf=d=>(new Date(d+"T12:00:00Z").getUTCDay()+6)%7;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2600)}
function saveAuth(a){auth=a;try{a?localStorage.setItem(KEY,JSON.stringify(a)):localStorage.removeItem(KEY)}catch{}}

async function api(route,body){
  const isPost=body!==undefined;
  let url="/api/"+route;
  if(!isPost&&auth) url+="?pin="+encodeURIComponent(auth.pin)+"&user="+(auth.me||"");
  const r=await fetch(url,isPost?{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({pin:auth?.pin,user:auth?.me,...body})}:{});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.error||"Errore, riprova"),{status:r.status});
  return j;
}
const photoUrl=(d,u,t)=>`/api/photo-get?pin=${encodeURIComponent(auth.pin)}&user=${u}&d=${d}&v=${encodeURIComponent(t||"")}`;

/* ---------- avvio ---------- */
async function boot(){
  if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
  try{
    if(!auth){ const r=await fetch("/api/state").then(r=>r.json()); return r.created===false?screenCreate():screenJoin(); }
    S=await api("state");
    if(S.created===false){ saveAuth(null); return screenCreate(); }
    if(!auth.me){ saveAuth(null); return screenJoin(); }
    if(!S.users[auth.me].days) return screenDays(true);
    render();
  }catch(e){
    if(e.status===401){ saveAuth(null); return screenJoin("Codice cambiato o sbagliato"); }
    app.innerHTML=`<div class="loading" style="flex-direction:column;gap:14px;text-align:center"><b>Non riesco a collegarmi</b><span class="small">Controlla la connessione</span><button class="btn dark" style="width:auto;padding:12px 22px" onclick="boot()">Riprova</button></div>`;
  }
}

/* ---------- giorni ---------- */
function daysPicker(sel){return `<div class="days" id="days">${WD.map((d,i)=>`<button type="button" class="${sel.includes(i)?"on":""}" data-i="${i}">${d}</button>`).join("")}</div>`}
function bindDays(){document.querySelectorAll("#days button").forEach(b=>b.onclick=()=>b.classList.toggle("on"))}
const pickedDays=()=>[...document.querySelectorAll("#days button.on")].map(b=>+b.dataset.i);
const daysText=d=>d&&d.length?d.map(i=>WDL[i]).join(", "):"–";

function screenCreate(){
  app.innerHTML=`
  <div class="lbl">Benvenuti</div><h1 style="margin:6px 0 26px">Create la vostra sfida</h1>
  <div class="field"><span class="lbl">Il tuo nome</span><input type="text" id="na" autocomplete="off"></div>
  <div class="field"><span class="lbl">Il suo nome</span><input type="text" id="nb" autocomplete="off"></div>
  <div class="field"><span class="lbl">Codice di coppia</span><input type="password" id="pin" placeholder="Almeno 4 caratteri"><div class="small" style="margin-top:6px">Servirà a lui per entrare.</div></div>
  <div class="field"><span class="lbl">I giorni in cui ti alleni</span>${daysPicker([0,2,4])}<div class="small" style="margin-top:8px">Contano solo questi. Gli altri sono riposo: non perdi lo streak.</div></div>
  <button class="btn acc" id="go" style="margin-top:22px">Inizia</button><div class="err" id="err"></div>`;
  bindDays();
  $("#go").onclick=async()=>{
    const pin=$("#pin").value.trim(), nameA=$("#na").value.trim(), nameB=$("#nb").value.trim(), days=pickedDays();
    if(!nameA||!nameB) return $("#err").textContent="Scrivete i nomi";
    if(pin.length<4) return $("#err").textContent="Il codice deve avere almeno 4 caratteri";
    if(!days.length) return $("#err").textContent="Scegli almeno un giorno";
    $("#go").disabled=true;
    try{ saveAuth({pin,me:"a"}); S=await api("create",{nameA,nameB,days}); render(); }
    catch(e){ saveAuth(null); $("#err").textContent=e.message; $("#go").disabled=false; }
  };
}

function screenJoin(msg){
  app.innerHTML=`
  <div class="lbl">Benvenuto</div><h1 style="margin:6px 0 26px">Entra nella sfida</h1>
  <div class="field"><span class="lbl">Codice di coppia</span><input type="password" id="pin"></div>
  <button class="btn acc" id="go">Continua</button><div class="err" id="err">${msg||""}</div>`;
  $("#go").onclick=async()=>{
    const pin=$("#pin").value.trim(); if(!pin) return;
    $("#go").disabled=true;
    try{
      saveAuth({pin,me:null});
      const n=await api("names");
      app.innerHTML=`<div class="lbl">Ultimo passo</div><h1 style="margin:6px 0 26px">Chi sei?</h1>
        <div class="who"><button data-u="a">${esc(n.a)}</button><button data-u="b">${esc(n.b)}</button></div>`;
      document.querySelectorAll(".who button").forEach(b=>b.onclick=()=>{saveAuth({pin,me:b.dataset.u});boot()});
    }catch(e){ saveAuth(null); $("#err").textContent=e.message; $("#go").disabled=false; }
  };
}

function screenDays(first){
  const cur=(S&&S.users[auth.me].days)||[0,2,4];
  const html=`
  ${first?"":'<div class="grab"></div>'}
  <div class="lbl">${first?"Ultimo passo":"I tuoi giorni"}</div><h1 style="margin:6px 0 10px">In che giorni ti alleni?</h1>
  <p class="small" style="margin-bottom:22px">Segna i giorni in cui ti impegni ad allenarti. Contano solo questi: negli altri sei a riposo e lo streak non si rompe. Se ne salti 2 di fila, puoi recuperarli entro domenica.${first?"":" <b style='color:var(--ink)'>Le modifiche valgono da domani.</b>"}</p>
  ${daysPicker(cur)}
  <button class="btn acc" id="go" style="margin-top:24px">Salva i miei giorni</button><div class="err" id="err"></div>`;
  if(first){ app.innerHTML=html; } else { openSheet(html); }
  bindDays();
  $("#go").onclick=async()=>{
    const days=pickedDays(); if(!days.length) return $("#err").textContent="Scegli almeno un giorno";
    $("#go").disabled=true;
    try{ S=await api("days",{days}); closeSheet(); render(); toast("Giorni salvati ✓"); }catch(e){ $("#err").textContent=e.message; $("#go").disabled=false; }
  };
}

/* ---------- schermata principale ---------- */
function render(){
  const me=auth.me, ot=me==="a"?"b":"a", U=S.users, t=S.today, w=wdOf(t);
  const todayPosts=(S.album.find(x=>x.d===t)||{p:{}}).p;
  const myPosted=!!todayPosts[me], otPosted=!!todayPosts[ot];
  const archOpen=$("#arch")?.open||false;

  const skCard=u=>{
    const x=U[u], p=todayPosts[u];
    const st=p?`<span class="st done">Fatto ✓</span>`:(x.todayTraining?`<span class="st todo">Da fare oggi</span>`:`<span class="st">Riposo</span>`);
    return `<div class="sk ${u===me?"me":""}"><div class="lbl">${esc(x.name)}${u===me?" · tu":""}</div><div class="n"><b>${x.streak}</b><span>🔥</span></div><div class="small">record ${x.best}</div>${st}</div>`;
  };

  // blocco caricamento
  let hero="";
  if(!myPosted){
    hero=U[me].todayTraining
      ? `<div class="hero"><div class="lbl">La tua foto di oggi</div><h3>Allenati, scatta, carica.</h3>
         <ol class="steps"><li><b>1</b>Fai il tuo allenamento</li><li><b>2</b>Scatta una foto mentre ti alleni o appena hai finito</li><li><b>3</b>Caricala qui entro mezzanotte</li></ol>
         <button class="btn acc" onclick="pick()">📸 Scatta o carica la foto</button>
         <div class="small">Si apre la fotocamera o la galleria.${otPosted?` La foto di ${esc(U[ot].name)} si sblocca quando carichi la tua.`:""}</div></div>`
      : (U[me].debt
        ? `<div class="hero"><div class="lbl">Giorno di recupero</div><h3>Recupera un allenamento 💪</h3><p class="small" style="margin:-6px 0 18px">Oggi sei a riposo, ma se ti alleni e carichi la foto recuperi uno degli allenamenti saltati.</p><button class="btn acc" onclick="pick()">📸 Scatta o carica la foto</button></div>`
        : `<div class="hero"><div class="lbl">Oggi sei a riposo</div><h3>Niente obblighi oggi 😌</h3><p class="small" style="margin:-6px 0 18px">Se ti alleni lo stesso, la foto può servire a recuperare un allenamento saltato in settimana.</p><button class="btn dark" onclick="pick()">📸 Carica una foto bonus</button></div>`);
  }
  const myTile=myPosted
    ? `<div class="pic" onclick="zoom('${photoUrl(t,me,todayPosts[me].time)}')"><img src="${photoUrl(t,me,todayPosts[me].time)}" alt=""><span class="tag">Tu</span><button class="change" onclick="event.stopPropagation();pick()">Cambia</button><span class="time">${hhmm(todayPosts[me].time)}</span></div>`
    : `<div class="pic empty"><span class="tag">Tu</span><div class="ph">La tua foto<br>apparirà qui</div></div>`;
  let otTile;
  const canSee=myPosted||!U[me].todayTraining;
  if(otPosted&&canSee) otTile=`<div class="pic" onclick="zoom('${photoUrl(t,ot,todayPosts[ot].time)}')"><img src="${photoUrl(t,ot,todayPosts[ot].time)}" alt=""><span class="tag">${esc(U[ot].name)}</span><span class="time">${hhmm(todayPosts[ot].time)}</span></div>`;
  else if(otPosted) otTile=`<div class="pic"><img class="blur" src="${photoUrl(t,ot,todayPosts[ot].time)}" alt=""><span class="tag">${esc(U[ot].name)}</span><div class="lock"><em>🔒</em>Carica la tua<br>per vederla</div></div>`;
  else otTile=`<div class="pic empty"><span class="tag">${esc(U[ot].name)}</span><div class="ph">${U[ot].todayTraining?"Non ancora…":"Oggi riposa"}</div></div>`;

  const pens=S.penalties.open.map(p=>`<div class="pen"><div class="lbl">🚨 Penitenza · ${esc(U[p.user].name)}</div><p>${esc(p.text)}</p><div class="small">${S.rule} allenamenti saltati di fila e non recuperati (fino al ${fmt(p.date,{day:"numeric",month:"long"})})</div>${p.user!==me?`<button onclick="penDone('${p.id}')">Segna come fatta ✓</button>`:""}</div>`).join("");

  const dl=d=>fmt(d,{weekday:"long",day:"numeric",month:"long"});
  const nAll=k=>k===1?"1 allenamento":k+" allenamenti";
  const warns=[me,ot].filter(u=>U[u].debt).map(u=>{const x=U[u];return u===me
    ? `<div class="warn"><div class="lbl">⚠️ Attenzione</div><p>Hai saltato ${S.rule} allenamenti di fila</p><div class="small">Recupera ${nAll(x.debt.left)} entro ${dl(x.debt.deadline)}: allenati in un giorno di riposo e carica la foto. Altrimenti scatta la penitenza 😈</div></div>`
    : `<div class="warn"><div class="lbl">⚠️ ${esc(x.name)}</div><p>Ha saltato ${S.rule} allenamenti di fila</p><div class="small">Deve recuperarne ${x.debt.left} entro ${dl(x.debt.deadline)}, poi scatta la penitenza 😈</div></div>`}).join("");
  const myDays=`<div class="days">${WD.map((d,i)=>`<span class="${(U[me].days||[]).includes(i)?"on":""} ${i===w?"now":""}">${d}</span>`).join("")}</div>`;

  const track=u=>{const x=U[u];return `<div class="track"><div class="head"><b>${esc(x.name)}</b><span>${x.month===null?"questo mese: –":"questo mese: "+x.month+"%"}</span></div><div class="g">${WD.map(d=>`<span class="wd">${d}</span>`).join("")}${x.grid.map(c=>`<i class="${c.s}"></i>`).join("")}</div></div>`};

  const past=S.album.filter(x=>x.d!==t);
  const album=past.map(x=>{
    const cell=u=>x.p[u]?`<div class="pic" onclick="zoom('${photoUrl(x.d,u,x.p[u].time)}')"><img loading="lazy" src="${photoUrl(x.d,u,x.p[u].time)}" alt=""><span class="tag">${esc(U[u].name)}</span></div>`:`<div class="pic"><span class="tag">${esc(U[u].name)}</span><div class="ph">–</div></div>`;
    return `<div class="day"><div class="d">${fmt(x.d,{weekday:"long",day:"numeric",month:"long"})}</div><div class="two">${cell(me)}${cell(ot)}</div></div>`;
  }).join("");

  const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  const notifOk=("Notification" in window)&&Notification.permission==="granted";
  const notice=!standalone
    ? `<div class="notice"><span>📲</span><div><b>Aggiungi alla Home</b><br>Condividi → Aggiungi alla schermata Home, poi aprila da lì.</div></div>`
    : (!notifOk?`<div class="notice"><span>🔔</span><div><b>Attiva le notifiche</b></div><button onclick="enableNotif()">Attiva</button></div>`:"");

  app.innerHTML=`
  <div class="top"><div><div class="lbl">${fmt(t,{weekday:"long",day:"numeric",month:"long"})}</div><h1>Allenamenti</h1></div><button class="gear" onclick="settings()" aria-label="Impostazioni"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  ${notice}
  <div class="block streaks">${skCard(me)}${skCard(ot)}</div>
  <div class="block"><div class="row"><h2>Oggi</h2></div>${hero}<div class="pics" style="${hero?"margin-top:10px":""}">${myTile}${otTile}</div></div>
  ${warns||pens?`<div class="block">${warns}${pens}</div>`:""}
  <div class="block"><div class="row"><h2>I miei giorni di allenamento</h2><button class="link" onclick="screenDays(false)">Modifica</button></div>
    <div class="card">${myDays}<p class="small" style="margin-top:12px">Contano solo questi giorni. Negli altri sei a riposo e lo streak non si rompe.</p><p class="small" style="margin-top:6px">${esc(U[ot].name)}: ${daysText(U[ot].days)}</p></div></div>
  <div class="block"><div class="row"><h2>Costanza</h2></div><div class="card">${track(me)}${track(ot)}
    <div class="legend"><span><i style="background:var(--acc)"></i>fatto</span><span><i style="box-shadow:inset 0 0 0 2px rgba(255,90,78,.6)"></i>saltato</span><span><i style="background:rgba(198,255,61,.32)"></i>recuperato</span><span><i style="background:#18181A;box-shadow:inset 0 0 0 1px var(--line)"></i>riposo</span></div></div></div>
  <div class="block"><details class="arch" id="arch" ${archOpen?"open":""}><summary><div><h2>Archivio foto</h2><div class="small">${past.length?past.length+(past.length===1?" giorno":" giorni"):"Ancora vuoto"}</div></div><span class="ch">⌄</span></summary><div class="body">${album||'<p class="small">Qui troverete le vostre foto dei giorni passati.</p>'}</div></details></div>`;
}

/* ---------- foto ---------- */
function pick(){ if(busy) return; $("#file").value=""; $("#file").click(); }
$("#file").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  busy=true; toast("Carico la foto…");
  try{ const data=await compress(f); S=await api("photo",{image:data}); render(); toast("Foto caricata 💪"); }
  catch(err){ toast(err.message||"Errore, riprova"); }
  busy=false;
};
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1280, r=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.82));
    };
    img.onerror=()=>rej(new Error("Foto non leggibile"));
    img.src=url;
  });
}
function zoom(src){const d=document.createElement("div");d.className="light-box";d.innerHTML=`<img src="${src}">`;d.onclick=()=>d.remove();document.body.appendChild(d)}

/* ---------- penitenze ---------- */
async function penDone(id){ try{ S=await api("penalty",{id}); render(); toast("Penitenza saldata ✓"); }catch(e){ toast(e.message); } }
function penList(){
  const box=$("#penbox"); if(!box) return;
  box.innerHTML=`<ul class="list">${PL.map((p,i)=>`<li><span>${esc(p)}</span><button onclick="PL.splice(${i},1);penList()" aria-label="Togli">×</button></li>`).join("")}</ul>
   <div class="add"><input type="text" id="newpen" placeholder="Aggiungi una penitenza…"><button onclick="const v=$('#newpen').value.trim();if(v){PL.push(v);penList()}">+</button></div>
   <button class="btn dark" style="margin-top:12px" onclick="savePens()">Salva le penitenze</button>`;
}
async function savePens(){ try{ S=await api("list",{list:PL}); toast("Penitenze salvate ✓"); }catch(e){ toast(e.message); } }

/* ---------- notifiche ---------- */
function b64(s){const p="=".repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...b].map(c=>c.charCodeAt(0)))}
async function enableNotif(){
  try{
    if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)) return toast("Apri il sito dalla schermata Home");
    const perm=await Notification.requestPermission();
    if(perm!=="granted") return toast("Notifiche non consentite");
    const reg=await navigator.serviceWorker.ready;
    const {key}=await api("vapid");
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(key)});
    await api("sub",{sub:sub.toJSON()});
    await api("test",{});
    toast("Notifiche attive ✓"); render();
  }catch(e){ toast(e.message&&e.message.length<80?e.message:"Non riesco ad attivarle, riprova"); }
}

/* ---------- impostazioni ---------- */
function openSheet(html){closeSheet();const s=document.createElement("div");s.className="sheet";s.id="sheet";s.innerHTML=`<div class="in"><div class="xbar"><button class="x" onclick="closeSheet()" aria-label="Chiudi">✕</button></div>${html}</div>`;s.onclick=e=>{if(e.target===s)closeSheet()};document.body.appendChild(s)}
function closeSheet(){const s=$("#sheet");if(s)s.remove()}
function settings(){
  PL=[...S.list];
  openSheet(`<div class="grab"></div>
   <div class="sec"><div class="lbl" style="margin-bottom:10px">Notifiche</div>
     <button class="btn acc" onclick="enableNotif()">🔔 Attiva le notifiche</button>
     <p class="small" style="margin-top:10px">Nei tuoi giorni di allenamento, finché non carichi la foto: 5 promemoria la mattina, 5 il pomeriggio e 5 la sera.</p></div>
   <div class="sec"><div class="lbl" style="margin-bottom:6px">La regola</div><p style="font-weight:700">${S.rule} allenamenti saltati di fila = penitenza estratta a sorte. Puoi evitarla recuperandoli entro domenica: allenati in un giorno di riposo e carica la foto. La penitenza la segna come fatta l'altra persona.</p></div>
   <div class="sec"><div class="lbl" style="margin-bottom:4px">Le penitenze</div><p class="small" style="margin-bottom:6px">Togliete o aggiungete quelle che volete. Valgono per tutti e due.</p><div id="penbox"></div></div>
   ${S.penalties.done.length?`<div class="sec"><div class="lbl">Penitenze saldate</div><ul class="list">${S.penalties.done.map(p=>`<li><span>${esc(S.users[p.user].name)}: ${esc(p.text)}</span></li>`).join("")}</ul></div>`:""}
   <button class="btn dark" onclick="if(confirm('Vuoi uscire da questo telefono?')){saveAuth(null);location.reload()}">Esci</button>`);
  penList();
}

setInterval(()=>{ if(document.visibilityState==="visible"&&auth&&auth.me&&S&&!busy&&!$("#sheet")) api("state").then(s=>{S=s;render()}).catch(()=>{}); },45000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&auth&&auth.me&&!busy&&!$("#sheet")) api("state").then(s=>{S=s;render()}).catch(()=>{}); });
boot();
</script>
